[project]
name = "simple-back"
version = "0.7.0"
description = "A backtester with minimal setup and sensible defaults."
authors = [{name = "Christoph Minixhofer", email = "christoph.minixhofer@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pandas_market_calendars>=4.0",
    "numpy>=1.24",
    "diskcache>=5.0",
    "pytz>=2023.3",
    "beautifulsoup4>=4.12",
    "memoization>=0.4",
    "tabulate>=0.9",
    "requests>=2.31",
    "alpaca-py>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
]
yahoo = [
    "yfinance>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_back*"]
